openapi: 3.1.0
info:
  title: Kaveri Stays API
  version: 0.1.0
  description: |
    Hand-written API specification for the Kaveri Stays assignment.
    Stage 3 defines the API surface only; route handlers are not part of this specification.

servers:
  - url: http://127.0.0.1:8000

tags:
  - name: Properties
  - name: Guests
  - name: Bookings
  - name: Availability
  - name: Payments
  - name: Reports
  - name: Authentication

paths:

  /properties:
    get:
      tags: [Properties]
      summary: List properties
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Property list. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /properties/{property_id}:
    get:
      tags: [Properties]
      summary: Get one property
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{property_id}/rooms:
    get:
      tags: [Properties]
      summary: List rooms in a property
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Room list. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{property_id}/availability:
    get:
      tags: [Availability]
      summary: Check room availability
      description: |
        Returns rooms in one property that can accommodate the requested
        number of guests and have no conflicting booking during the requested
        date range. An optional room_type filters the result.
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/CheckIn'
        - $ref: '#/components/parameters/CheckOut'
        - $ref: '#/components/parameters/Guests'
        - $ref: '#/components/parameters/RoomType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Available room list. No availability returns an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /guests:
    get:
      tags: [Guests]
      summary: List guests
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Guest list. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /guests/{guest_id}:
    get:
      tags: [Guests]
      summary: Get one guest
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/GuestId'
      responses:
        '200':
          description: Guest found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Booking list. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Bookings]
      summary: Create a booking
      security: [BearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bookings/{booking_id}:
    get:
      tags: [Bookings]
      summary: Get one booking
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{booking_id}/status:
    patch:
      tags: [Bookings]
      summary: Change booking status
      description: |
        One status endpoint models the booking lifecycle. Allowed transitions
        are enforced by the business rules:
        confirmed -> checked_in
        checked_in -> checked_out
        confirmed -> cancelled
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingStatusUpdate'
      responses:
        '200':
          description: Booking status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /payments:
    get:
      tags: [Payments]
      summary: List payments
      security: [BearerAuth: []]
      parameters:
        - name: booking_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Payment list. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Payments]
      summary: Record a payment
      description: |
        A booking may have several payments. The client supplies an idempotency
        key in the Idempotency-Key header. Repeating the same request with the
        same key represents the same payment and must not create a second
        payment.
      security: [BearerAuth: []]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated key for this payment attempt.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reports/occupancy:
    get:
      tags: [Reports]
      summary: Occupancy report
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/PropertyFilter'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Occupancy report. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccupancyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reports/adr:
    get:
      tags: [Reports]
      summary: ADR report
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/PropertyFilter'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: ADR report. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdrReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reports/revpar:
    get:
      tags: [Reports]
      summary: RevPAR report
      security: [BearerAuth: []]
      parameters:
        - $ref: '#/components/parameters/PropertyFilter'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: RevPAR report. Empty results return an empty list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevparReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a guest account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Guest account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated identity
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    PropertyId:
      name: property_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    GuestId:
      name: guest_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip. Offset pagination is used uniformly.
      schema:
        type: integer
        minimum: 0
        default: 0

    CheckIn:
      name: check_in
      in: query
      required: true
      schema:
        type: string
        format: date
      example: '2028-05-01'

    CheckOut:
      name: check_out
      in: query
      required: true
      schema:
        type: string
        format: date
      example: '2028-05-04'

    Guests:
      name: guests
      in: query
      required: true
      schema:
        type: integer
        minimum: 1

    RoomType:
      name: room_type
      in: query
      required: false
      description: Filter by room type name.
      schema:
        type: string
        example: Deluxe

    PropertyFilter:
      name: property_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1

    ReportFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date

    ReportTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date

  responses:

    BadRequest:
      description: Bad request or business-rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Authenticated caller does not have permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Request conflicts with current state or uniqueness/idempotency rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    Property:
      type: object
      required: [property_id, name, city, star_rating]
      properties:
        property_id:
          type: integer
          format: int64
        name:
          type: string
        city:
          type: string
        star_rating:
          type: integer
          minimum: 1
          maximum: 5

    Room:
      type: object
      required: [room_id, room_number, room_type, max_occupancy]
      properties:
        room_id:
          type: integer
          format: int64
        room_number:
          type: string
        room_type:
          type: string
        max_occupancy:
          type: integer
          minimum: 1

    Guest:
      type: object
      required: [guest_id, full_name, email]
      properties:
        guest_id:
          type: integer
          format: int64
        full_name:
          type: string
        email:
          type: string
          format: email

    Booking:
      type: object
      required:
        - booking_id
        - guest_id
        - room_id
        - check_in
        - check_out
        - guests_count
        - status
      properties:
        booking_id:
          type: integer
          format: int64
        guest_id:
          type: integer
          format: int64
        room_id:
          type: integer
          format: int64
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [confirmed, checked_in, checked_out, cancelled, no_show]

    BookingCreate:
      type: object
      required: [guest_id, room_id, check_in, check_out, guests_count]
      properties:
        guest_id:
          type: integer
          format: int64
          minimum: 1
        room_id:
          type: integer
          format: int64
          minimum: 1
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests_count:
          type: integer
          minimum: 1

    BookingStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [checked_in, checked_out, cancelled]

    Payment:
      type: object
      required:
        - payment_id
        - booking_id
        - amount
        - method
        - status
        - created_at
      properties:
        payment_id:
          type: integer
          format: int64
        booking_id:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        method:
          type: string
          enum: [cash, card, upi, bank_transfer]
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time

    PaymentCreate:
      type: object
      required: [booking_id, amount, method]
      properties:
        booking_id:
          type: integer
          format: int64
          minimum: 1
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        method:
          type: string
          enum: [cash, card, upi, bank_transfer]

    OccupancyReport:
      type: object
      required: [property_id, date, occupied_rooms, available_rooms, occupancy_rate]
      properties:
        property_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        occupied_rooms:
          type: integer
          minimum: 0
        available_rooms:
          type: integer
          minimum: 0
        occupancy_rate:
          type: number
          format: double

    AdrReport:
      type: object
      required: [property_id, date, adr]
      properties:
        property_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        adr:
          type: number
          format: double
          minimum: 0

    RevparReport:
      type: object
      required: [property_id, date, revpar]
      properties:
        property_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        revpar:
          type: number
          format: double
          minimum: 0

    RegisterRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true

    RegisterResponse:
      type: object
      required: [account_id, guest_id, email, role]
      properties:
        account_id:
          type: integer
          format: int64
        guest_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [guest]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          writeOnly: true

    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          writeOnly: true
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 900

    CurrentUser:
      type: object
      required: [account_id, role]
      properties:
        account_id:
          type: integer
          format: int64
        role:
          type: string
          enum: [guest, staff, manager, owner]

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
