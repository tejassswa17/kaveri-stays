$kind: http-example
request:
  url: "{{baseUrl}}/bookings"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "room_id": 1136,
        "check_in": "2008-04-12",
        "check_out": "1985-04-19",
        "guests": 7999,
        "guest_id": 5837,
        "deposit": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
