$kind: http-example
request:
  url: "{{baseUrl}}/bookings/:booking_id/review"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    booking_id: "7720"
  body:
    type: json
    content: |-
      {
        "rating": 3,
        "comment": null
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
